<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zugang · 14 Tage Winter-Hundechallenge</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    @font-face { font-family:'DM Sans'; font-style:normal; font-weight:300 600; font-display:swap;
      src:url('../fonts/rP2Hp2ywxg089UriCZOIHQ.woff2') format('woff2');
      unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family:'Cormorant Garamond'; font-style:normal; font-weight:300 700; font-display:swap;
      src:url('../fonts/co3bmX5slCNuHLi8bLeY9MK7whWMhyjYqXtK.woff2') format('woff2');
      unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #FAF8F3; --surface: #F3EDE2; --brown: #8B5E3C; --brown-light: #B5845A;
      --sage: #6B8B6E; --text: #1E1A14; --text-muted: #8A7A68;
      --ff-serif: 'Cormorant Garamond', Georgia, serif;
      --ff-sans:  'DM Sans', system-ui, sans-serif;
    }

    body {
      font-family: var(--ff-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 44px 36px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 32px rgba(139,94,60,.12), 0 1px 4px rgba(139,94,60,.06);
      text-align: center;
    }

    .logo { height: 60px; width: auto; margin-bottom: 24px; }

    h1 {
      font-family: var(--ff-serif);
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .subtitle { color: var(--text-muted); font-size: .9rem; margin-bottom: 36px; line-height: 1.5; }

    .field-label {
      display: block;
      text-align: left;
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px 16px;
      border: 1.5px solid rgba(139,94,60,.2);
      border-radius: 12px;
      font-family: var(--ff-sans);
      font-size: 1.05rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      margin-bottom: 20px;
      letter-spacing: .12em;
    }
    input[type="text"]:focus {
      border-color: var(--brown);
      box-shadow: 0 0 0 3px rgba(139,94,60,.12);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      min-height: 52px;
      background: var(--brown);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: var(--ff-sans);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-submit:hover, .btn-submit:focus-visible { background: var(--brown-light); }
    .btn-submit:focus-visible { outline: 3px solid var(--brown); outline-offset: 3px; }

    .error-box {
      margin-top: 20px;
      padding: 14px 16px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      color: #991B1B;
      font-size: .88rem;
      text-align: left;
      line-height: 1.55;
    }

    .contact-hint { margin-top: 20px; font-size: .82rem; color: var(--text-muted); }
    .contact-hint a { color: var(--brown); text-decoration: none; }
    .contact-hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <img src="../Logo2.png" alt="Mary and the Dogs" class="logo">
    <h1>14 Tage Winter-Hundechallenge</h1>
    <p class="subtitle">Gib deinen Zugangscode ein, um zu starten.</p>

    <form method="POST" action="/winter-challenge/auth">
      <label class="field-label" for="code">Zugangscode</label>
      <input type="text" id="code" name="code"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="dein-zugangscode"
        required>
      <button type="submit" class="btn-submit">Jetzt starten →</button>
    </form>

    <div class="error-box" id="err" hidden>
      Der Code stimmt leider nicht. Schreib mir gern, wenn du Hilfe brauchst.
    </div>

    <p class="contact-hint">Fragen? <a href="mailto:info@maryandthedogs.de">info@maryandthedogs.de</a></p>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('error') === '1') {
      document.getElementById('err').hidden = false;
      document.getElementById('code').focus();
    }
  </script>
</body>
</html>
